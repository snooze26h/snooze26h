name: profile cards

on:
  schedule:
    - cron: "17 0 * * *"   # daily, 00:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cards.yml"
      - "scripts/**"

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: generate stats + calendar cards
        run: python scripts/gen_cards.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}

      - name: generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#b48cff&color_dots=#2a1d52,#4c3390,#6d4fc2,#9d7bd8,#d9ccff
            dist/snake-light.svg?palette=github-light&color_snake=#7c3aed&color_dots=#e6ddfb,#c9b6f7,#a98df0,#8560e3,#5b2fc9

      - name: publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
