name: profile cards

on:
  schedule:
    - cron: "17 0 * * *"   # daily, 00:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cards.yml"
      - "scripts/**"

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      # CARDS_TOKEN 是可选的 PAT：默认的 GITHUB_TOKEN 只能看到公开仓库，
      # 会让 repos 数和语言占比漏掉私有仓库；没配置时自动退回默认 token
      - name: generate stats + streak cards
        run: python scripts/gen_cards.py
        env:
          GITHUB_TOKEN: ${{ secrets.CARDS_TOKEN || secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}

      # snk 是第三方 action，挂掉时不该连累自绘的 stats/calendar 一起停更
      - name: generate contribution snake
        id: snake
        continue-on-error: true
        uses: Platane/snk@d8f6715049803e982ee5ff501b6b9b7d5deeb09b  # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#b48cff&color_dots=#2a1d52,#4c3390,#6d4fc2,#9d7bd8,#d9ccff
            dist/snake-light.svg?palette=github-light&color_snake=#7c3aed&color_dots=#e6ddfb,#c9b6f7,#a98df0,#8560e3,#5b2fc9

      # snk 是 docker action，以 root 身份写产物，后续步骤要先拿回属主才能改写
      - name: take ownership of the snk output
        run: sudo chown -R "$(id -u):$(id -g)" dist

      # 发布会用 dist 整体替换 output 分支，缺文件等于删文件；
      # 所以 snk 失败时得把上一版蛇图捞回来，否则 README 上的蛇会裂成 404
      - name: reuse last published snake if generation failed
        if: steps.snake.outcome != 'success'
        env:
          REPO: ${{ github.repository }}
        run: |
          echo "::warning::Platane/snk failed — reusing the previously published snake"
          echo "⚠️ snake generation failed; reused the previously published snake." >> "$GITHUB_STEP_SUMMARY"
          for f in snake-dark.svg snake-light.svg; do
            if curl -fsSL --retry 2 -o "dist/$f" "https://raw.githubusercontent.com/$REPO/output/$f" \
               && head -c 512 "dist/$f" | grep -q "<svg"; then
              echo "recovered $f"
            else
              echo "::error::could not recover a usable $f from the output branch"
              exit 1
            fi
          done

      # snk 失败时 fallback 取回的已经是成品卡，不能再套一层框
      - name: frame the snake in a card
        if: steps.snake.outcome == 'success'
        run: python scripts/wrap_snake.py

      - name: publish to output branch
        uses: crazy-max/ghaction-github-pages@df5cc2bfa78282ded844b354faee141f06b41865  # v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
